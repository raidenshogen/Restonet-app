<section class="vh-100 d-flex align-items-center justify-content-center">
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-6 text-black">
        <div class="px-1 ms-xl-3 logo-container">
          <img src="../../../assets/img/logos/restonet.jpg" alt="Logo image">
        </div>
        <div class="px-1 ms-xl-3 flags-container">
          <span><img src="../../../assets/drapeaux/Italy.png" alt="italy image">
          <img src="../../../assets/drapeaux/france.png" alt="france image">
          <img src="../../../assets/drapeaux/united_kingdom.png" alt="uk image"></span>
        </div>
        <div class="d-flex align-items-center justify-content-center mt-auto">
          <pre>{{ textService.restonetText}}</pre>

        </div>
        <div class="d-flex align-items-center justify-content-center">
          <form style="width: 400px" (submit)="onSubmit()">
            <div class="mb-lg-4">
              <label for="client" class="form-label">Identifiant</label>
              <input type="text" class="form-control custom-input" id="client" aria-describedby="client" name="client" placeholder="Entrer votre code ici" [formControl]="clientControl">
            </div>
            <div class="mb-lg-4">
              <label for="password" class="form-label">Mot de passe</label>
              <input type="password" class="form-control custom-input" id="password" name="password"  placeholder="Entrez votre mot de passe ici" [formControl]="passwordControl">
            </div>
            <div  class="text-center">
              <button type="submit" class="btn btn-primary">Ouvrir une session</button>
            </div>
          </form>
        </div>
        <div  class="text-center mb-4">
          <span> Mot de passe perdu?</span><a class="forgot-password" routerLink="/passwordperdu"> Cliquer Ici</a>
        </div>
      </div>
      <div class="col-sm-6 px-0 d-none d-sm-block">
        <img src="../../../assets/img/logos/LoginImg.jpg" alt="Login image" class="w-100 vh-100" style="object-fit: cover; object-position: left;">
      </div>
    </div>
  </div>
</section>
