<section class="vh-100 d-flex align-items-center justify-content-center">
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-6 text-black">
        <div class="px-1 ms-xl-3 logo-container">
          <img src="../../../assets/img/logos/restonet.jpg" alt="Logo image">
        </div>
        <div class="px-1 ms-xl-3 flags-container">
          <span><img src="../../../assets/drapeaux/Italy.png" alt="italy image">
          <img src="../../../assets/drapeaux/france.png" alt="france image">
          <img src="../../../assets/drapeaux/united_kingdom.png" alt="uk image"></span>
        </div>
        <br>
        <br>
        <br>
         <div>
           <h4 style="text-align: center; font-family: 'system-ui'"> Espace administrateur</h4>
         </div>
        <br><br>

        <div class="d-flex align-items-center justify-content-center">
          <form style="width: 400px">
            <div class="alert alert-danger" *ngIf="error==1">
              <strong> User Authentification Failed ! </strong>
            </div>
            <div class="mb-lg-4">
              <label for="exampleInputEmail1" class="form-label">Identifiant</label>
              <input type="email" [(ngModel)]="user.client" class="form-control custom-input" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Entrer votre code ici" name="00059" >
            </div>
            <div class="mb-lg-4">
              <label for="exampleInputPassword1" class="form-label">Mot de passe</label>
              <input type="password" [(ngModel)]="user.motdepasseintranet"  class="form-control custom-input" id="exampleInputPassword1"  placeholder="Entrez votre mot de passe ici" name="0000">
            </div>
            <div  class="text-center">
              <button type="submit" class="btn btn-primary"  (click)="onLoggedin()">Ouvrir une session</button>
            </div>
            <div  class="text-center mb-4">
              <span> Mot de passe perdu?</span><a class="forgot-password" routerLink="/passwordperdu"> Cliquer Ici</a>
            </div>
          </form>
        </div>


      </div>
      <div class="col-sm-6 px-0 d-none d-sm-block">
        <img src="../../../assets/img/logos/LoginImg.jpg" alt="Login image" class="w-100 vh-100" style="object-fit: cover; object-position: left;">
      </div>
    </div>
  </div>
</section>
